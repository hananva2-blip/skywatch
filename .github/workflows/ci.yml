name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install flake8
        run: pip install flake8

      - name: Run lint check
        run: flake8 app/frontend/app.py app/worker/worker.py --max-line-length=120

  build-and-push:
    needs: lint
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set short SHA
        id: vars
        run: echo "sha_short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build and push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./app/frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/skywatch-frontend:${{ steps.vars.outputs.sha_short }}
            ghcr.io/${{ github.repository_owner }}/skywatch-frontend:latest

      - name: Build and push Worker
        uses: docker/build-push-action@v6
        with:
          context: ./app/worker
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/skywatch-worker:${{ steps.vars.outputs.sha_short }}
            ghcr.io/${{ github.repository_owner }}/skywatch-worker:latest

      - name: Install mikefarah/yq
        run: |
          wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

      - name: Update Helm values
        run: |
          yq -i '.frontend.image.tag = "${{ steps.vars.outputs.sha_short }}"' helm/skywatch/values.yaml
          yq -i '.worker.image.tag = "${{ steps.vars.outputs.sha_short }}"' helm/skywatch/values.yaml

      - name: Commit and push tag bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/skywatch/values.yaml
          if git diff --staged --quiet; then
            echo "No changes in values.yaml to commit"
          else
            git commit -m "chore(ci): update image tags to ${{ steps.vars.outputs.sha_short }} [skip ci]"
            git push
          fi
