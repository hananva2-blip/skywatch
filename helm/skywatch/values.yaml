# Image tags are bumped automatically by CI (.github/workflows/ci.yml)
frontend:
  image:
    repository: ghcr.io/hananva2-blip/skywatch-frontend
    tag: "2618767"
  replicas: 1
  nodePort: 30080
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 200m, memory: 128Mi}
worker:
  image:
    repository: ghcr.io/hananva2-blip/skywatch-worker
    tag: "2618767"
  replicas: 2
  resources:
    requests: {cpu: 25m, memory: 48Mi}
    limits: {cpu: 100m, memory: 96Mi}
rabbitmq:
  image: rabbitmq:3.13-management
  # Course setting only: in production keep this out of Git (Sealed Secrets / External Secrets)
  auth:
    username: skywatch
    password: skywatch-rabbit
  storage: 1Gi
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 256Mi}
# All app pods run on worker2; ArgoCD lives on worker1, the master is tainted
nodeSelector:
  kubernetes.io/hostname: skywatch-worker2
monitoring:
  # Rendered only if the ServiceMonitor CRD (kube-prometheus-stack) exists in the cluster
  serviceMonitors: true
