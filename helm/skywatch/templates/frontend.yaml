apiVersion: apps/v1
kind: Deployment
metadata:
  name: skywatch-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    app: skywatch-frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: skywatch-frontend
  template:
    metadata:
      labels:
        app: skywatch-frontend
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/rabbitmq-secret.yaml") . | sha256sum }}
    spec:
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          env:
            {{- include "skywatch.rabbitmqEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: skywatch-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    app: skywatch-frontend
spec:
  type: NodePort
  selector:
    app: skywatch-frontend
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      nodePort: {{ .Values.frontend.nodePort }}
{{- if include "skywatch.serviceMonitorsEnabled" . }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: skywatch-frontend-monitor
  namespace: {{ .Release.Namespace }}
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: skywatch-frontend
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
{{- end }}
