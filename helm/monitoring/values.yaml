# Slim kube-prometheus-stack overrides for t3.micro nodes.
# Placement follows the measured memory budget (see README): Prometheus next to the app on
# worker2, operator and kube-state-metrics on worker1 with ArgoCD, Grafana on the master.
# Install: see "Monitoring" in README.md (CRDs first, then helm install --skip-crds)

alertmanager:
  enabled: false        # saves ~100 MB RAM

# The control plane components are not reachable for scraping on K3s
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

# Keep scrape load off the 1 GB master: its API server timed out under monitoring load
kubeApiServer:
  enabled: false

kubelet:
  serviceMonitor:
    probes: false
    resource: false
    relabelings:
      - action: replace
        sourceLabels: [__metrics_path__]
        targetLabel: metrics_path
      - action: drop
        sourceLabels: [__meta_kubernetes_endpoint_address_target_name]
        regex: skywatch-master
    cAdvisorRelabelings:
      - action: replace
        sourceLabels: [__metrics_path__]
        targetLabel: metrics_path
      - action: drop
        sourceLabels: [__meta_kubernetes_endpoint_address_target_name]
        regex: skywatch-master

prometheus-node-exporter:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist

prometheusOperator:
  nodeSelector:
    kubernetes.io/hostname: skywatch-worker
  resources:
    limits: { cpu: 200m, memory: 128Mi }

kube-state-metrics:
  nodeSelector:
    kubernetes.io/hostname: skywatch-worker
  resources:
    limits: { cpu: 100m, memory: 64Mi }

prometheus:
  prometheusSpec:
    retention: 24h
    scrapeInterval: 60s
    # Pick up the skywatch ServiceMonitors in any namespace
    serviceMonitorSelectorNilUsesHelmValues: false
    nodeSelector:
      kubernetes.io/hostname: skywatch-worker2
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 500m, memory: 384Mi }

# Grafana and its two sidecars need ~230 MB: too much for worker1 next to ArgoCD,
# so it runs on the t3.small master, which has ~600 MB spare
grafana:
  nodeSelector:
    kubernetes.io/hostname: skywatch-master
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  service:
    type: NodePort
    nodePort: 30030
  # A rolling update runs two Grafana pods at once, which overloaded the 1 GB node
  deploymentStrategy:
    type: Recreate
  # First-start DB migrations take several minutes on a 1 GB node; the default
  # 60 s delay restarted Grafana in the middle of them, over and over
  livenessProbe:
    httpGet:
      path: /api/health
      port: grafana
    initialDelaySeconds: 600
    periodSeconds: 10
    timeoutSeconds: 30
    failureThreshold: 10
  # /api/health takes 2-3 s while dashboards load; the default 1 s timeout marked the pod
  # unready and the NodePort stopped answering
  readinessProbe:
    httpGet:
      path: /api/health
      port: grafana
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 6
  # Course setting only: change it, or use grafana.admin.existingSecret
  adminPassword: "skywatch-grafana"
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    # 300m throttled Grafana while it rendered dashboards; the master has 2 vCPUs.
    # At 256Mi the cgroup kept evicting Grafana's page cache and it re-read its files from
    # disk at ~140 MB/s (the gp3 limit), so every request took 10-20 s.
    limits: { cpu: 1000m, memory: 512Mi }
  sidecar:
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { cpu: 100m, memory: 128Mi }
