---
- name: Prepare all nodes
  hosts: k3s_cluster
  become: true
  tasks:
    - name: Wait for apt lock release and update cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

- name: Install K3s Master
  hosts: master
  become: true
  tasks:
    - name: Install K3s server
      shell: |
        curl -sfL https://get.k3s.io | sh -s - server \
          --tls-san {{ ansible_host }} \
          --write-kubeconfig-mode 644
      args:
        creates: /etc/rancher/k3s/k3s.yaml

    - name: Wait for node token
      wait_for:
        path: /var/lib/rancher/k3s/server/node-token

    - name: Read master node token
      slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: token_encoded

    - name: Set token fact
      set_fact:
        k3s_token: "{{ token_encoded.content | b64decode | trim }}"

    - name: Fetch kubeconfig to local machine
      fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: ~/.kube/config
        flat: yes

- name: Install K3s Workers
  hosts: workers
  become: true
  tasks:
    - name: Join worker nodes to cluster
      shell: |
        curl -sfL https://get.k3s.io | K3S_URL=https://{{ hostvars['skywatch-master']['private_ip'] }}:6443 K3S_TOKEN={{ hostvars['skywatch-master']['k3s_token'] }} sh -
      args:
        creates: /usr/local/bin/k3s-agent
