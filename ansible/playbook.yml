---
- name: Prepare all nodes
  hosts: k3s_cluster
  become: true
  tasks:
    - name: Wait for apt lock release and update cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Check for existing swap file
      stat:
        path: /swapfile
      register: swapfile

    - name: Create swap file (t3.micro has only 1 GB RAM)
      shell: |
        fallocate -l {{ swap_size_mb }}M /swapfile
        chmod 600 /swapfile
        mkswap /swapfile
      when: not swapfile.stat.exists

    - name: Enable swap now
      command: swapon /swapfile
      when: ansible_swaptotal_mb == 0

    - name: Enable swap on boot
      lineinfile:
        path: /etc/fstab
        line: "/swapfile none swap sw 0 0"

- name: Install K3s Master
  hosts: master
  become: true
  tasks:
    # Re-running the playbook must not reinstall a healthy master
    - name: Check whether K3s server is already running
      command: systemctl is-active k3s
      register: k3s_status
      changed_when: false
      failed_when: false

    - name: Install K3s server
      shell: |
        curl -sfL https://get.k3s.io | sh -s - server \
          --node-name {{ inventory_hostname }} \
          --tls-san {{ ansible_host }} \
          --disable traefik \
          --node-taint node-role.kubernetes.io/control-plane:NoSchedule \
          --write-kubeconfig-mode 644
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
      when: k3s_status.stdout != "active"

    - name: Wait for node token
      wait_for:
        path: /var/lib/rancher/k3s/server/node-token

    - name: Read master node token
      slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: token_encoded

    - name: Set token fact
      set_fact:
        k3s_token: "{{ token_encoded.content | b64decode | trim }}"

    - name: Fetch kubeconfig to the repo root (gitignored)
      fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ kubeconfig_path }}"
        flat: yes

    - name: Point kubeconfig at the master public IP
      become: false
      delegate_to: localhost
      replace:
        path: "{{ kubeconfig_path }}"
        regexp: "https://127\\.0\\.0\\.1:6443"
        replace: "https://{{ ansible_host }}:6443"

- name: Install K3s Workers
  hosts: workers
  become: true
  tasks:
    - name: Check whether K3s agent is already running
      command: systemctl is-active k3s-agent
      register: agent_status
      changed_when: false
      failed_when: false

    # Private IP: traffic to the public IP leaves via the IGW and bypasses the SG self-rule.
    # The installer reads K3S_URL/K3S_TOKEN from the environment, not from CLI flags.
    - name: Join worker nodes to cluster
      shell: curl -sfL https://get.k3s.io | sh -s - agent --node-name {{ inventory_hostname }}
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
        K3S_URL: "https://{{ hostvars['skywatch-master']['private_ip'] }}:6443"
        K3S_TOKEN: "{{ hostvars['skywatch-master']['k3s_token'] }}"
      when: agent_status.stdout != "active"
